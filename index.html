<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简易笔记 — Simplenote 风格中文笔记</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 左侧栏：标签 / 搜索 / 回收站 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">简易笔记</span>
      </div>

      <div class="search-wrap">
        <input type="search" id="search" placeholder="搜索笔记…" autocomplete="off" />
      </div>

      <nav class="nav">
        <div class="nav-item active" id="navNotes">
          <span class="nav-ico">▤</span><span>全部笔记</span>
        </div>

        <div class="tags-section">
          <div class="tags-header">标签</div>
          <ul class="tag-list" id="tagList"></ul>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item" id="navTrash"><span class="nav-ico">🗑</span><span>回收站</span></div>
      <div class="nav-item" id="navDark"><span class="nav-ico">🌙</span><span>深色模式</span></div>
      <div class="nav-item" id="navAccount"><span class="nav-ico">☁</span><span id="navAccountLabel">云同步</span></div>
      <div class="nav-item" id="navSettings"><span class="nav-ico">⚙</span><span>设置</span></div>
      <div class="nav-item" id="navExport"><span class="nav-ico">⬇</span><span>导出备份</span></div>
        <div class="nav-item" id="navImport"><span class="nav-ico">⬆</span><span>导入备份</span></div>
      </div>
    </aside>

    <!-- 中栏：笔记列表 -->
    <section class="note-list-pane">
      <div class="note-list-header">
        <span id="listTitle">全部笔记</span>
        <div class="header-actions">
          <button id="newNoteBtn" title="新建笔记 (Ctrl+N)">＋</button>
          <select id="sortSelect" title="排序方式">
            <option value="modified">修改时间</option>
            <option value="created">创建时间</option>
            <option value="title">标题</option>
          </select>
        </div>
      </div>
      <div class="note-list" id="noteList"></div>
    </section>

    <!-- 右栏：编辑器 -->
    <section class="editor-pane">
      <div class="editor-toolbar hidden" id="editorToolbar"></div>
      <textarea id="editor" placeholder="开始记录你的想法…" spellcheck="false"></textarea>
      <div class="preview-pane" id="previewPane" hidden></div>
      <div class="editor-empty" id="editorEmpty">
        <div class="empty-inner">
          <div class="empty-ico">📝</div>
          <p>选择左侧一条笔记，或点击「＋」新建</p>
        </div>
      </div>
    </section>
  </div>

  <!-- 信息弹窗 -->
  <div class="modal" id="infoModal" hidden>
    <div class="modal-box">
      <h3>笔记信息</h3>
      <div id="infoBody"></div>
      <div class="modal-actions">
        <button id="infoClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-box">
      <h3>设置</h3>
      <div class="setting-row">
        <label>界面与正文字体</label>
        <select id="fontSelect"></select>
      </div>
      <div class="setting-row">
        <label>自定义字体</label>
        <input id="fontCustom" placeholder="输入已安装字体名，如：思源黑体" />
        <button id="fontCustomApply">应用</button>
      </div>
      <div class="setting-row">
        <label>字号</label>
        <select id="fontSizeSelect">
          <option value="14">小</option>
          <option value="16">中</option>
          <option value="18">大</option>
          <option value="20">特大</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="settingsClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 云同步 / 账号弹窗 -->
  <div class="modal" id="accountModal" hidden>
    <div class="modal-box">
      <h3>云同步账号</h3>
      <p class="modal-sub">登录后，笔记会在你的设备之间自动同步（本地优先，离线也能用）。</p>
      <div id="accLoggedOut">
        <div class="setting-row">
          <label>服务端地址</label>
          <input id="serverUrl" placeholder="http://localhost:3000" />
        </div>
        <div class="setting-row">
          <label>用户名</label>
          <input id="accUser" placeholder="你的账号" />
        </div>
        <div class="setting-row">
          <label>密码</label>
          <input id="accPass" type="password" placeholder="至少 6 位" />
        </div>
        <div class="modal-actions" style="text-align:left">
          <button id="btnLogin" class="primary">登录</button>
          <button id="btnRegister">注册</button>
        </div>
      </div>
      <div id="accLoggedIn" hidden>
        <p>已登录：<b id="accName"></b></p>
        <p class="sync-status" id="syncStatus">就绪</p>
        <div class="modal-actions" style="text-align:left">
          <button id="btnSync" class="primary">立即同步</button>
          <button id="btnLogout">退出登录</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="accountClose">关闭</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFile" accept=".json" hidden />

  <script src="app.js"></script>
</body>
</html>
