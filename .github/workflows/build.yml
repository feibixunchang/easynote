name: 简易笔记 · 三端打包发布

# 在云端分别用 Windows / macOS / Linux runner 打包，产出三个平台的安装包，
# 最后统一聚合成一个 GitHub Release（含 Mac / Win / Linux 三个安装包）。
#
# 用法：在本地推送一个以 v 开头的 tag（如 v1.2.1）即可自动构建并发布。
#   git tag v1.2.1 && git push origin v1.2.1
#
# 说明：
#   - macOS 在云端没有苹果开发者证书，产物为 ad-hoc 签名，下载后首次打开需
#     右键「打开」一次以绕过 Gatekeeper；本机亲手打包（build-mac-local.sh）则无此限制。
#   - Windows / Linux 为正常发行包。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 安装 macOS 打包必需的原生模块 dmg-license
        if: matrix.os == 'macos-latest'
        run: npm install dmg-license

      - name: 安装 Linux 系统依赖（打包 deb/rpm 需要）
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - name: 打包（仅构建，不自动发布；macOS 强制 ad-hoc 签名）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish never

      # deb 硬链接自检（v1.2.5 及之前版本的 deb 在 Deepin 25 等系统上安装失败）：
      # 若 deb 内 /opt 与 /usr/share/icons 下的同名图标共享 inode，打包器会写成
      # 硬链接条目，dpkg 跨文件系统解包时报「Invalid cross-device link」。
      # afterPack 钩子已从源头避免；这里再做「修复 + 发布前拦截」双保险。
      - name: 修复并校验 deb 包（存在硬链接条目则拒绝发布）
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then echo "没有 deb 产物，跳过"; exit 0; fi
          for deb in "${debs[@]}"; do
            echo "==== $deb ===="
            listing=$(dpkg-deb --fsys-tarfile "$deb" | tar -tvf - 2>/dev/null)
            if [ -z "$listing" ]; then
              echo "::error::无法读取 $deb 的内容列表"; exit 1
            fi
            if echo "$listing" | grep -q '^h'; then
              echo "发现硬链接条目，先修复再发布："
              echo "$listing" | grep '^h'
              tmp=$(mktemp -d)
              # sudo 保持 root 属主；解开后把 nlink>1 的文件复制成独立 inode，重建即无硬链接条目
              sudo dpkg-deb -R "$deb" "$tmp/pkg"
              sudo find "$tmp/pkg" -type f -links +1 -print0 | while IFS= read -r -d '' f; do
                sudo cp -p "$f" "$f.__unlink_tmp__" && sudo mv "$f.__unlink_tmp__" "$f"
              done
              sudo dpkg-deb -b "$tmp/pkg" "$tmp/out.deb"
              sudo mv "$tmp/out.deb" "$deb"
              sudo rm -rf "$tmp"
            fi
            listing2=$(dpkg-deb --fsys-tarfile "$deb" | tar -tvf - 2>/dev/null)
            if echo "$listing2" | grep -q '^h'; then
              echo "::error::$deb 仍包含硬链接条目（tar 类型 h），会导致跨文件系统安装失败，拒绝发布"
              exit 1
            fi
            echo "OK：无硬链接条目"
          done

      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p release
          cp dist/*.exe        release/ 2>/dev/null || true
          cp dist/*.dmg        release/ 2>/dev/null || true
          cp dist/*.AppImage   release/ 2>/dev/null || true
          cp dist/*.deb        release/ 2>/dev/null || true
          cp dist/*.rpm        release/ 2>/dev/null || true
          cp dist/*.zip        release/ 2>/dev/null || true
          ls -lh release/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 简易笔记-${{ matrix.os }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -lh all-artifacts/

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 简易笔记 ${{ github.ref_name }}
          files: all-artifacts/*
          # 桌面端是正式版：保持 latest，客户端更新检查以它为准
          prerelease: false
          body: |
            ## 简易笔记 ${{ github.ref_name }}

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | 🍎 macOS | `*.dmg` | 通用包，Intel / Apple 芯片均可；首次打开请右键「打开」 |
            | 🪟 Windows | `*.exe` | NSIS 安装包 |
            | 🐧 Linux | `*.AppImage` / `*.deb` | AppImage 免安装 / deb 包 |

            ### 更新内容（${{ github.ref_name }}）
            - **修复 Mac 上点「设置」指针转半天**：以前为了列字体跑 `system_profiler`（本机实测 **40 秒**，
              旧代码 15 秒超时后静默回退），整段同步执行把主进程冻住。现在改成 NSFontManager 直读（**0.4 秒**、
              331 个字体族），并做成异步 + 内存/磁盘双层缓存 + 启动预热，弹窗立刻可用。
            - **字体列表更干净**：过滤掉 `.PingFang SC` 这类 macOS 私有字体（426 → 331），下拉不再一堆看不懂的名字。
            - **开着 👁 预览也能继续打字**：以前点预览会把编辑器整个隐藏，带图笔记直接没法改。
              现在改成上下分栏——上面看渲染结果（含图片），下面仍是输入框。
            - **删除笔记加确认弹窗**：删除、永久删除都要二次确认，并显示被删笔记的首行，避免误删。
            - **回收站工具条对齐**：「♻ 恢复」「🗑 永久删除」统一尺寸、水平对齐，不再一高一低。
            - 修复「带图片的笔记没法继续打字」：落盘防抖（600ms）+ 失焦/关窗前补写。
            - 修复字体切换「显示换了、实际没换」：重写字体栈生成，并清掉候选列表里的乱码字体名。
            - 新增「字体预览」实时样张：设置里切换字体立刻可见。
            - 修复回收站跨端不一致：服务端墓碑 + `POST /api/notes/purge`，永久删除随同步下发到所有设备。
            - 更新检查更准：三渠道兜底（releases API → latest 重定向 → releases.atom）+ 只认纯 semver 标签。

            > 服务端需同步升级（`server/server.js`，新增墓碑存储与 purge 接口），否则跨端删除不会同步。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
